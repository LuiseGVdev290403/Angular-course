<h1>DragonBall Page</h1>
<hr />

<section class="row">
    <div class="col-12 col-sm-6">
        <h3>Agregar : {{name()}}</h3>
        <input type="text"  class="form-control" placeholder="Nombre"
            [value]="name()"
            (change)="name.set(txtName.value)"
            (input)="name.set(txtName.value)"
            #txtName 
        >

        <h3>El poder actual es: {{power()}}</h3>
        <input type="number" class="form-control mt-2" placeholder="Poder"
        [value]="power()"
        (input)="power.set(+txtNumber.value)"
        #txtNumber
        >

        <button (click)="addPower()" class="btn btn-primary mt-4">Add</button>
    </div>

    <div class="col-12 col-sm-6">
        <h3>Listado</h3>
        <ol>
            @for (character of characters(); track character.id) {
                @if ( character.power > 500) {
                    <li> 
                        <span>{{character.name}}</span>
                        <strong  [class.text-danger]="character.power > 9000" [class.text-primary]="character.power < 9000" >({{ character.power}}) </strong>
                            <!-- [ngClass]="powerClasses()" -->
                    </li>
                } @else {
                    <li><strong>Aqui no hay nadie</strong></li>
                }
            }
        </ol>
    </div>

</section>
